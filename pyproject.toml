[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proscraper"
version = "0.1.0"
description = "Desktop web scraper with a visual element picker and persistent browser sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "playwright>=1.50",
    "SQLAlchemy>=2.0",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "pyinstaller>=6.11", "openpyxl>=3.1"]

[project.scripts]
proscraper = "scraper_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scraper_app = ["extraction/picker.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
